[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hisim"
dynamic = ["version"]
description = "A simulation benchmark tool for hicache"
dependencies = [
    "numpy",
    "scikit-learn",
    "xgboost",
    "aiconfigurator @ /home/chuchao/aiconfigurator",
    # "aiconfigurator @ git+https://github.com/ai-dynamo/aiconfigurator.git@main",
    "sglang==0.5.6.post2",
    "torch==2.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
